name: Build BusySyncAgent

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pyinstaller requests psutil schedule pystray Pillow

      - name: Build exe
        run: pyinstaller --onefile --windowed --name "BusySyncAgent" agent_v2.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BusySyncAgent
          path: dist/BusySyncAgent.exe
